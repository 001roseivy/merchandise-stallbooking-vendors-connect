
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENDOR | Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5f9;
 color:#182238;
}
header{
 background:#14213d;
 color:white;
 padding:22px;
}
header h2{margin:0}
main{
 max-width:1100px;
 margin:25px auto;
 padding:15px;
}
.card{
 background:white;
 padding:20px;
 border-radius:12px;
 margin-bottom:18px;
 box-shadow:0 2px 10px #0001;
}
input{
 width:100%;
 padding:13px;
 border:1px solid #ccc;
 border-radius:7px;
 margin:8px 0;
}
button{
 padding:11px 16px;
 border:0;
 border-radius:7px;
 cursor:pointer;
 font-weight:bold;
 margin:4px;
}
.primary{background:#14213d;color:white}
.approve{background:#16834a;color:white}
.reject{background:#c62828;color:white}
.logout{background:#555;color:white}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:12px;
}
.stat{
 background:#eef2f8;
 padding:17px;
 border-radius:9px;
}
.stat strong{
 display:block;
 font-size:27px;
 margin-bottom:5px;
}
.booking{
 background:white;
 border:1px solid #e2e7ef;
 border-radius:9px;
 padding:15px;
 margin:12px 0;
 overflow-wrap:anywhere;
}
.status{
 font-weight:bold;
 text-transform:uppercase;
}
#dashboard{display:none}
.message{color:#c62828}
.muted{color:#667085}
</style>
</head>

<body>

<header>
<h2>VENDOR</h2>
<p>Administrator Booking Dashboard</p>
</header>

<main>

<section id="login" class="card">
<h3>Administrator Login</h3>
<p class="muted">Sign in using your authorised administrator account.</p>

<input id="email" type="email" placeholder="Administrator email">
<input id="password" type="password" placeholder="Password">

<button class="primary" onclick="login()">Sign In</button>
<p id="message" class="message"></p>
</section>

<section id="dashboard">

<div class="card">
<h3>Welcome, Administrator</h3>
<button class="primary" onclick="loadBookings()">Refresh Bookings</button>
<button class="logout" onclick="logout()">Sign Out</button>
</div>

<div class="grid">
<div class="stat">
<strong id="total">0</strong>
Total bookings
</div>

<div class="stat">

 
<strong id="pending">0</strong>

 await loadBookings();
}

checkSession();

</script>

</body>
</html>
