
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUSINESS - Vendor Stall Booking</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f5f4;
  margin: 0;
  color: #222;
}
header {
  background: #123b30;
  color: white;
  padding: 25px;
  text-align: center;
}
main {
  max-width: 420px;
  background: white;
  margin: 35px auto;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #0002;
}
input {
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
}
button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 6px;
  background: #13734e;
  color: white;
  font-size: 16px;
}
.switch {
  background: #e9efec;
  color: #123b30;
}
#message {
  margin-top: 15px;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>

<header>
<h1>BUSINESS</h1>
<p>Vendor Stall Booking Platform</p>
</header>

<main>
<h2 id="heading">Customer Registration</h2>

<form id="authForm">
<input id="email" type="email"
placeholder="Email address" required>

<input id="password" type="password"
placeholder="Password (minimum 6 characters)"
minlength="6" required>

<button id="submitButton" type="submit">
Create Account
</button>
</form>

<button class="switch" id="switchButton" type="button">
Already registered? Login
</button>

<p id="message" role="status"></p>
</main>

<script>
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const SITE_URL =
"https://001roseivy.github.io/merchandise-stallbooking-vendors-connect/";

let loginMode = false;

const form = document.getElementById("authForm");
const message = document.getElementById("message");

document.getElementById("switchButton").onclick = () => {
  loginMode = !loginMode;

  document.getElementById("heading").textContent =
    loginMode ? "Customer Login" : "Customer Registration";

  document.getElementById("submitButton").textContent =
    loginMode ? "Login" : "Create Account";

  document.getElementById("switchButton").textContent =
    loginMode ? "New customer? Register" :
    "Already registered? Login";

  message.textContent = "";
};

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const submitButton = document.getElementById("submitButton");

  submitButton.disabled = true;
  message.textContent = "Please wait...";

  try {
    if (loginMode) {
      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      if (!data.session) {
        throw new Error("Login session was not created. Please try again.");
      }

      window.location.href = SITE_URL + "stalls.html";

    } else {
      const { data, error } =
        await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: SITE_URL
          }
        });

      if (error) throw error;

      if (data.session) {
        window.location.href = SITE_URL + "stalls.html";
      } else {
        message.textContent =
          "Account created! Please check your email, verify your address, then return here and log in.";
      }
    }

  } catch (error) {
    message.textContent = "Error: " + error.message;
  } finally {
    submitButton.disabled = false;
  }
});

async function checkExistingSession() {
  const { data, error } =
    await supabaseClient.auth.getSession();

  if (!error && data.session) {
    window.location.href = SITE_URL + "stalls.html";
  }
}

checkExistingSession();
</script>

</body>
</html>
